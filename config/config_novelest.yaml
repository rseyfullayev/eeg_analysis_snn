defaults:
  - data: seed_v
  - encoder: analog
  - decoder: spiking        
  - architecture: phase1a
  - training: phase1a
  - _self_

encoder:
  use_odconv: true

training:
  use_pk_sampler: true
  temporal_decay_enabled: false
  temporal_decay_factor: 0.99
  use_supmoco: true
  supmoco_momentum: 0.9
  supmoco_queue_size: 512
  


experiment_name: "MobileNet_SWIGLU"
description: "Phase 1 with MobileNet Encoder with Supervised MoCo and Differential Masking"

mask:
  type: "Statistical Mask"
  sigma: 0.25
  radius: 0.7

loss:
  smooth: 0.0
  lambda_seg: 0.0
  lambda_con: 0.0
  temperature: 0.1
  iic_enabled: true
  decoupled: true
  iic_intra_weight: 1.0
  iic_inter_weight: 1.0
  lambda_class: 1.0
  lambda_fire: 0.0
  target_rate: 0.1
  alpha: 0.3
  beta: 0.7

logging:
  project_name: "snn-encoding-showdown"
  run_name: "MobileNet"
  tags: ["mobilenet", "tsm", "phase1a"]
  offline: false
  log_interval: 1