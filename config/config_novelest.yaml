defaults:
  - data: seed_v
  - encoder: analog
  - decoder: spiking        
  - architecture: phase1a
  - training: phase1a
  - _self_

experiment_name: "MobileNet_SWIGLU"
description: "Phase 1 with MobileNet Encoder and SwiGLU Attention Heads"

mask:
  type: "Differential"
  sigma: 0.25
  radius: 0.7

loss:
  smooth: 0.0
  lambda_seg: 0.0
  lambda_con: 0.0
  temperature: 0.07
  iic_enabled: false
  iic_intra_weight: 0.5
  iic_inter_weight: 3.0
  lambda_class: 1.0
  lambda_fire: 0.0
  target_rate: 0.1
  alpha: 0.3
  beta: 0.7

logging:
  project_name: "snn-encoding-showdown"
  run_name: "MobileNet"
  tags: ["mobilenet", "tsm", "phase1a"]
  offline: false
  log_interval: 1