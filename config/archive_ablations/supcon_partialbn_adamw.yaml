defaults:
  - data: seed_v
  - encoder: analog
  - decoder: spiking        
  - architecture: phase1a
  - training: phase1a
  - logger: default
  - _self_

encoder:
  use_odconv: true
  use_batchnorm: true
  p_drop: 0.3

training:
  use_pk_sampler: true
  subject_diverse_k: true
  temporal_decay_enabled: false
  temporal_decay_factor: 0.99
  use_supmoco: true
  supmoco_momentum: 0.9
  supmoco_queue_size: 512
  use_muon: false
  use_fourier_mixup: false




experiment_name: "MobileNet"
description: "Phase 1 with MobileNet Encoder with Supervised MoCo and Differential Masking"

mask:
  type: "Statistical Mask"
  sigma: 0.25
  radius: 0.7

loss:
  smooth: 0.0
  lambda_seg: 0.0
  lambda_con: 0.0
  temperature: 0.1
  use_scda: true
  decoupled: true
  iic_intra_weight: 1.0
  iic_inter_weight: 1.0
  lambda_class: 1.0
  lambda_fire: 0.0
  target_rate: 0.1
  alpha: 0.3
  beta: 0.7
  exclude_same_trial: false  
  use_dann: false
  dann_weight: 1.0
  dann_alpha: 1.0
  use_mmd: false
  lambda_mmd: 0.1
  cosface_margin: 0.0

logging:
  project_name: "snn-encoding-showdown"
  run_name: "MobileNet"
  tags: ["mobilenet", "tsm", "phase1a"]
  offline: false
  log_interval: 1
  